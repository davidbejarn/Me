<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Juan David{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
        

<header class="topbar">
    <div class="navbar">
        <h2 class="logo">
            <a href="/" style="display:flex; align-items:center; gap:8px; text-decoration:none; color:inherit;">
                <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo" style="height:40px;">
            </a>
        </h2>

        <ul class="nav-links">
            <li><a href="/">About</a></li>
            <li><a href="/blog">Blog</a></li>
            <li><a href="/projects">Projects</a></li>
            <li><a href="/contact">Contact</a></li>
            <li><a href="/resume">CV</a></li>
            <li>
                <div class="theme-switch-wrapper">
                    <img src="{{ url_for('static', filename='img/sun.png') }}" 
                        alt="Light mode" 
                        class="theme-icon theme-icon-img">

                    <label class="theme-switch">
                        <input type="checkbox" id="themeToggle">
                        <span class="slider"></span>
                    </label>
                    
                    <img src="{{ url_for('static', filename='img/moon.png') }}" 
                        alt="Dark mode" 
                        class="theme-icon theme-icon-img">
                </div>
            </li>
        </ul>
    </div>
</header>

{% block content %}{% endblock %}

<script>
  const root = document.documentElement;
  const themeToggle = document.getElementById("themeToggle");

  // Cargar tema guardado (dark por defecto)
  let theme = localStorage.getItem("theme") || "dark";
  root.setAttribute("data-theme", theme);
  themeToggle.checked = theme === "dark";

  // Cambiar tema al hacer click
  themeToggle.addEventListener("change", () => {
    const next = themeToggle.checked ? "dark" : "light";
    root.setAttribute("data-theme", next);
    localStorage.setItem("theme", next);
  });

  // Efecto de scroll en navbar
    window.addEventListener('scroll', () => {
    const topbar = document.querySelector('.topbar');
    if (window.scrollY > 20) {
        topbar.classList.add('scrolled');
    } else {
        topbar.classList.remove('scrolled');
    }
    });
</script>

</body>
</html>
