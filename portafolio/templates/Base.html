<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Juan David{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<header class="topbar">
    <div class="navbar">
        <h2 class="logo">
            <a href="/" style="display:flex; align-items:center; gap:8px; text-decoration:none; color:inherit;">
                <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo" style="height:40px;">
            </a>
        </h2>

        <ul class="nav-links">
            <li><a href="/">About</a></li>
            <li><a href="/about">Blog</a></li>
            <li><a href="/projects">Projects</a></li>
            <li><a href="/contact">Contact</a></li>
            <li><a href="/resume">CV</a></li>
            <li>
                <button id="themeToggle" class="btn-cv" type="button">🌙</button>
            </li>
        </ul>
    </div>
</header>

{% block content %}{% endblock %}

<script>
  const root = document.documentElement;
  const themeToggle = document.getElementById("themeToggle");

  let theme = localStorage.getItem("theme") || "dark";
  root.setAttribute("data-theme", theme);
  themeToggle.textContent = theme === "light" ? "☀️" : "🌙";

  themeToggle.addEventListener("click", () => {
    const current = root.getAttribute("data-theme");
    const next = current === "dark" ? "light" : "dark";

    root.setAttribute("data-theme", next);
    localStorage.setItem("theme", next);
    themeToggle.textContent = next === "light" ? "☀️" : "🌙";
  });
</script>

</body>
</html>
